<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="/fragments/header :: header"/>
</head>

<body>

<div th:replace="/fragments/header :: navbar"/>

<div class="container">

    <!-- Show this info message only if registered successfully -->
    <div class="alert alert-info"
         th:if="${successMessage}"
         th:utext="${successMessage}">
    </div>

    <div class="row" style="margin-top:20px">

        <div class="col-xs-12 col-sm-8 col-md-6 col-sm-offset-2 col-md-offset-3">

            <form autocomplete="off"
                  action="#"
                  th:action="@{/registration}"
                  th:object="${user}"
                  method="post"
                  role="form">

                <!-- Name -->
                <div class="form-group">

                    <label th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}"
                           class="alert alert-danger">
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           placeholder="Enter Name Sarika"
                           class="form-control input-lg"/>
                </div>

                <!-- Last Name -->
                <div class="form-group">

                    <label th:if="${#fields.hasErrors('lastName')}"
                           th:errors="*{lastName}"
                           class="alert alert-danger">
                    </label>

                    <input type="text"
                           th:field="*{lastName}"
                           placeholder="Enter Last Name kalsait"
                           class="form-control input-lg"/>
                </div>

                <!-- Email -->
                <div class="form-group">

                    <label th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}"
                           class="alert alert-danger">
                    </label>

                    <input type="text"
                           th:field="*{email}"
                           placeholder="Enter Email sarikakalsait3@gmail"
                           class="form-control input-lg"/>
                </div>

                <!-- Password -->
                <div class="form-group">

                    <label th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"
                           class="alert alert-danger">
                    </label>

                    <input type="password"
                           th:field="*{password}"
                           placeholder="Enter Password sarika@123"
                           class="form-control input-lg"/>
                </div>

                <!-- Username -->
                <div class="form-group">

                    <label th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}"
                           class="alert alert-danger">
                    </label>

                    <input type="text"
                           th:field="*{username}"
                           placeholder="Enter the Username sarikakalsait"
                           class="form-control input-lg"/>
                </div>

                <!-- Submit Button -->
                <div class="row">

                    <div class="col-sm-3"
                         style="float: none; margin: 0 auto;">

                        <input type="submit"
                               class="btn btn-primary btn-block"
                               value="Submit Data "/>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

<div th:replace="/fragments/footer :: footer"/>

</body>
</html>
